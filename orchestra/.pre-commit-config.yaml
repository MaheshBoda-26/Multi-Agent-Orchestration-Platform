# Local gates: lint, types, and the fast unit suite. Commands run through uv so
# they always use the locked environment.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-unit
        name: pytest (unit)
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
        types: [python]
