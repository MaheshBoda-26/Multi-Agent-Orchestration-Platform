# Ruff configuration.
# Focus: real problems first (unused imports/names, bug patterns). Style-only
# rule families (UP, SIM, formatting) are a separate, dedicated pass so this
# change set stays reviewable.
line-length = 100
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/BackgroundTasks in defaults is idiomatic
]

[lint.per-file-ignores]
"tests/**" = ["B011"]
