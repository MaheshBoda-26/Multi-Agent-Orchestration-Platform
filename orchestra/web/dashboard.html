<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestra - Cost &amp; Escalation Dashboard</title>
    <link rel="stylesheet" href="/static/approval.css">
    <style>
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 16px 20px; }
        .stat-card .value { font-size: 24px; font-weight: 700; color: #1a1a1a; }
        .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
        .panel { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        .panel h2 { font-size: 16px; margin-bottom: 12px; color: #1a1a1a; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
        th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge.completed { background: #e8f5e9; color: #2e7d32; }
        .badge.awaiting_human { background: #fff3e0; color: #e65100; }
        .badge.paused { background: #fff3e0; color: #e65100; }
        .badge.failed { background: #fde0e0; color: #b71c1c; }
        .badge.running, .badge.queued { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cost &amp; Escalation Dashboard</h1>
            <div class="header-controls">
                <a href="/explorer" class="task-link">Explorer &rarr;</a>
                <a href="/approvals/ui" class="task-link">Approvals &rarr;</a>
                <span id="last-refresh" class="muted"></span>
                <button class="refresh-btn" onclick="loadStats()">Refresh</button>
            </div>
        </header>

        <div class="stats-grid" id="stats-grid"></div>

        <div class="panel">
            <h2>Cost by model</h2>
            <table id="models-table">
                <thead><tr><th>Model</th><th class="num">Prompt tokens</th><th class="num">Completion tokens</th><th class="num">Cost (USD)</th></tr></thead>
                <tbody></tbody>
            </table>
            <p class="muted" id="models-empty" style="display:none">No model usage recorded yet.</p>
        </div>

        <div class="panel">
            <h2>Runs by status</h2>
            <table id="status-table">
                <thead><tr><th>Status</th><th class="num">Runs</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="panel">
            <h2>Human escalations by trigger</h2>
            <table id="escalations-table">
                <thead><tr><th>Trigger</th><th>Status</th><th class="num">Count</th></tr></thead>
                <tbody></tbody>
            </table>
            <p class="muted" id="escalations-empty" style="display:none">No approvals recorded yet.</p>
        </div>
    </div>

    <script>
        "use strict";

        function fmtUsd(value) {
            return "$" + Number(value).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
        }

        async function loadStats() {
            try {
                const response = await fetch("/stats/cost");
                const stats = await response.json();
                renderStats(stats);
                document.getElementById("last-refresh").textContent =
                    "updated " + new Date().toLocaleTimeString();
            } catch (e) {
                console.error("Failed to load stats:", e);
            }
        }

        function renderStats(stats) {
            document.getElementById("stats-grid").innerHTML = `
                <div class="stat-card"><div class="value">${stats.runs}</div><div class="label">Runs</div></div>
                <div class="stat-card"><div class="value">${fmtUsd(stats.cost_usd)}</div><div class="label">Total cost</div></div>
                <div class="stat-card"><div class="value">${stats.prompt_tokens.toLocaleString()}</div><div class="label">Prompt tokens</div></div>
                <div class="stat-card"><div class="value">${stats.completion_tokens.toLocaleString()}</div><div class="label">Completion tokens</div></div>
                <div class="stat-card"><div class="value">${stats.avg_latency_ms.toLocaleString()} ms</div><div class="label">Avg latency</div></div>`;

            const modelsBody = document.querySelector("#models-table tbody");
            const modelRows = Object.entries(stats.models || {});
            document.getElementById("models-empty").style.display = modelRows.length ? "none" : "block";
            modelsBody.innerHTML = modelRows.map(([model, s]) => `
                <tr><td>${escapeHtml(model)}</td>
                <td class="num">${s.prompt_tokens.toLocaleString()}</td>
                <td class="num">${s.completion_tokens.toLocaleString()}</td>
                <td class="num">${fmtUsd(s.cost_usd)}</td></tr>`).join("");

            document.querySelector("#status-table tbody").innerHTML =
                Object.entries(stats.runs_by_status || {}).map(([status, count]) => `
                <tr><td><span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span></td>
                <td class="num">${count}</td></tr>`).join("");

            const escalationRows = Object.entries(stats.escalations || {}).flatMap(([trigger, byStatus]) =>
                Object.entries(byStatus).map(([status, count]) => `
                <tr><td>${escapeHtml(trigger)}</td><td><span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span></td>
                <td class="num">${count}</td></tr>`));
            document.querySelector("#escalations-table tbody").innerHTML = escalationRows.join("");
            document.getElementById("escalations-empty").style.display = escalationRows.length ? "none" : "block";
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML;
        }

        loadStats();
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
