<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestra - Human Approval Queue</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1a1a1a; font-size: 28px; }
        .refresh-btn { padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .refresh-btn:hover { background: #0052a3; }
        
        .approval-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .escalation-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .escalation-badge.notify { background: #e3f2fd; color: #1565c0; }
        .escalation-badge.approve_action { background: #fff3e0; color: #e65100; }
        .escalation-badge.approve_plan { background: #fce4ec; color: #c2185b; }
        .escalation-badge.take_over { background: #fde0e0; color: #b71c1c; }
        
        .card-body { padding: 20px; }
        .detail-row { display: flex; margin-bottom: 12px; }
        .detail-label { width: 150px; font-weight: 500; color: #666; }
        .detail-value { flex: 1; color: #333; }
        .context-box { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 16px; margin-top: 16px; max-height: 300px; overflow: auto; }
        .context-box pre { white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #444; }
        
        .actions { display: flex; gap: 12px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .btn { padding: 10px 24px; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; font-size: 14px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        
        .clarify-form { display: none; margin-top: 16px; padding: 16px; background: #f8f9fa; border-radius: 6px; }
        .clarify-form textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
        .clarify-form .form-actions { display: flex; gap: 12px; margin-top: 12px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state h3 { margin-bottom: 8px; color: #666; }
        
        .task-link { color: #0066cc; text-decoration: none; }
        .task-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Human Approval Queue</h1>
            <button class="refresh-btn" onclick="loadApprovals()">Refresh</button>
        </header>
        
        <div id="approvals-container">
            <div class="empty-state" id="empty-state">
                <h3>No Pending Approvals</h3>
                <p>All tasks are running smoothly. No human intervention needed.</p>
            </div>
        </div>
    </div>

    <script>
        async function loadApprovals() {
            try {
                const response = await fetch('/approvals/pending');
                const approvals = await response.json();
                renderApprovals(approvals);
            } catch (e) {
                console.error('Failed to load approvals:', e);
            }
        }

        function renderApprovals(approvals) {
            const container = document.getElementById('approvals-container');
            const emptyState = document.getElementById('empty-state');
            
            if (approvals.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            container.innerHTML = approvals.map(approval => renderApprovalCard(approval)).join('');
        }

        function renderApprovalCard(a) {
            const created = new Date(a.created_at).toLocaleString();
            return `
                <div class="approval-card" data-id="${a.id}">
                    <div class="card-header">
                        <span class="escalation-badge ${a.escalation_level}">${a.escalation_level.replace('_', ' ')}</span>
                        <span style="color: #999; font-size: 14px;">${created}</span>
                    </div>
                    <div class="card-body">
                        <div class="detail-row">
                            <span class="detail-label">Task ID</span>
                            <span class="detail-value"><a href="/tasks/${a.task_id}" class="task-link" target="_blank">${a.task_id}</a></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Trigger</span>
                            <span class="detail-value">${a.trigger}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Proposed Action</span>
                            <span class="detail-value">${a.proposed_action || 'N/A'}</span>
                        </div>
                        
                        <div class="context-box">
                            <strong>Context:</strong>
                            <pre>${JSON.stringify(a.context, null, 2)}</pre>
                        </div>

                        <div class="actions">
                            <button class="btn btn-success" onclick="decide('${a.id}', 'approve')">Approve</button>
                            <button class="btn btn-danger" onclick="decide('${a.id}', 'reject')">Reject</button>
                            <button class="btn btn-secondary" onclick="showModify('${a.id}')">Modify</button>
                            <button class="btn btn-primary" onclick="showTakeOver('${a.id}')">Take Over</button>
                            <button class="btn btn-secondary" onclick="showClarify('${a.id}')">Clarify</button>
                        </div>

                        <div class="clarify-form" id="clarify-${a.id}">
                            <textarea id="clarify-input-${a.id}" placeholder="Ask the agent a clarifying question..."></textarea>
                            <div class="form-actions">
                                <button class="btn btn-primary" onclick="decide('${a.id}', 'clarify')">Send Clarification</button>
                                <button class="btn btn-secondary" onclick="hideClarify('${a.id}')">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function decide(approvalId, action) {
            const approval = document.querySelector(`[data-id="${approvalId}"]`);
            const payload = { action };
            
            if (action === 'modify') {
                const modified = prompt('Enter modified action:');
                if (!modified) return;
                payload.action = 'modify';
                payload.modified_action = modified;
            } else if (action === 'take_over') {
                const reason = prompt('Reason for take over:');
                if (!reason) return;
                payload.action = 'take_over';
                payload.clarification_question = reason;
            } else if (action === 'clarify') {
                const question = document.getElementById(`clarify-input-${approvalId}`).value;
                if (!question) { alert('Please enter a question'); return; }
                payload.action = 'clarify';
                payload.clarification_question = question;
            }

            try {
                const response = await fetch(`/approvals/${approvalId}/decide`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    loadApprovals();
                } else {
                    alert('Failed to resolve approval');
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function showModify(id) { decide(id, 'modify'); }
        function showTakeOver(id) { decide(id, 'take_over'); }
        function showClarify(id) { document.getElementById(`clarify-${id}`).style.display = 'block'; }
        function hideClarify(id) { document.getElementById(`clarify-${id}`).style.display = 'none'; }

        // Auto-refresh every 10 seconds
        setInterval(loadApprovals, 10000);
        loadApprovals();
    </script>
</body>
</html>
