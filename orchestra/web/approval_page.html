<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestra - Human Approval Queue</title>
    <link rel="stylesheet" href="/static/approval.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Human Approval Queue</h1>
            <div class="header-controls">
                <span id="last-refresh" class="muted"></span>
                <button class="refresh-btn" onclick="loadApprovals()">Refresh</button>
            </div>
        </header>

        <div id="approvals-container">
            <div class="empty-state" id="empty-state">
                <h3>No Pending Approvals</h3>
                <p>All tasks are running smoothly. No human intervention needed.</p>
            </div>
        </div>
    </div>

    <script src="/static/approval.js"></script>
</body>
</html>
