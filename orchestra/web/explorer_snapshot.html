    <li data-id="${task.task_id}" class="${task.task_id === selected ? "selected" : ""}">
      <div class="request"><span class="status-dot ${escapeHtml(task.status)}"></span>${escapeHtml(task.request)}</div>
      <div class="meta"><span>${escapeHtml(task.status)}</span><span>${new Date(task.created_at).toLocaleString()}</span></div>
    </li>`).join("");
  list.querySelectorAll("li[data-id]").forEach((li) => {
    li.addEventListener("click", () => {
      selected = li.dataset.id;
      renderTasks(SNAPSHOT.tasks);
      renderDetail(SNAPSHOT.detail);
      document.getElementById("note").textContent =
        "Snapshot carries the full trace for task " + SNAPSHOT.detail_task_id +
        "; other tasks show list data only. Start the API for live traces.";
    });
  });
}

function renderDetail(detail) {
  const el = document.getElementById("detail");
  if (!detail || detail.task_id !== selected) {
    el.innerHTML = '<div class="empty-state"><h3>Trace not in snapshot</h3><p>' +
      'This snapshot carries the full span trace for task ' + SNAPSHOT.detail_task_id + '.</p></div>';
    return;
  }
  el.innerHTML = `
    <div class="section">
      <div class="task-header">
        <span class="request"><span class="status-dot ${escapeHtml(detail.status)}"></span>${escapeHtml(detail.request)}</span>
        <span class="muted">${escapeHtml(detail.status)} · created ${new Date(detail.created_at).toLocaleString()}</span>
      </div>
    </div>
    <div class="section"><h2>Plan</h2><pre>${escapeHtml(JSON.stringify(detail.plan ?? [], null, 2))}</pre></div>
    <div class="section"><h2>Result</h2><pre>${escapeHtml(JSON.stringify(detail.result ?? {}, null, 2))}</pre></div>
    <div class="section"><h2>Trace</h2>${renderSpanTree(buildTree(detail.spans))}</div>`;
  el.querySelectorAll(".span-row").forEach((row) => {
    row.addEventListener("click", () => {
      const attrs = row.nextElementSibling;
      if (attrs && attrs.classList.contains("span-attrs")) attrs.classList.toggle("open");
    });
  });
}

function buildTree(spans) {
  const nodes = {};
  spans.forEach((s) => { nodes[s.span_id] = { ...s, children: [] }; });
  const roots = [];
  spans.forEach((s) => {
    const parent = s.parent_span_id;
    if (parent && nodes[parent]) nodes[parent].children.push(nodes[s.span_id]);
    else roots.push(nodes[s.span_id]);
  });
  return roots;
}

function renderSpanTree(roots) {
  if (!roots.length) return '<p class="muted">No spans recorded for this task.</p>';
  return `<ul class="span-tree">${roots.map(renderSpanNode).join("")}</ul>`;
}

function renderSpanNode(node) {
  const start = node.start_time ? Date.parse(node.start_time) : null;
  const end = node.end_time ? Date.parse(node.end_time) : null;
  const ms = start && end ? Math.max(0, end - start) : null;
  const attrs = Object.entries(node.attributes || {})
    .map(([key, value]) => `${key}=${JSON.stringify(value)}`).join("\n");
  const children = (node.children || []).map(renderSpanNode).join("");
  return `
    <li>
      <div class="span-row"><span class="span-name">${escapeHtml(node.name)}</span>
      <span class="span-latency">${ms === null ? "" : ms + " ms"}</span></div>
      <div class="span-attrs">${escapeHtml(attrs || "(no attributes)")}</div>
      ${children ? `<ul>${children}</ul>` : ""}
    </li>`;
}

document.getElementById("mem-heading").textContent =
  'Long-term memories for user "' + SNAPSHOT.mem_user + '" (latest ' + SNAPSHOT.memories.length +
  ' of ' + SNAPSHOT.mem_total + ' in DB)';
document.getElementById("memories").innerHTML = SNAPSHOT.memories.map((m) => `
  <div class="mem-card"><div class="content">${escapeHtml(m.content)}</div>
  <div class="meta"><span>#${m.id}</span><span>${escapeHtml(m.kind)}</span>
  <span>importance ${m.importance.toFixed(2)}</span><span>accessed ${m.access_count}x</span>
  <span>created ${new Date(m.created_at).toLocaleString()}</span></div></div>`).join("")
  || '<p class="muted">No memories for this user in the snapshot.</p>';

document.getElementById("note").textContent =
  "Static snapshot generated " + SNAPSHOT.generated_at + " from live Postgres data " +
  "(tasks, trace, memories, run stats). Start the API (uvicorn api.server:app) for the live explorer at /explorer.";
renderTasks(SNAPSHOT.tasks);
renderDetail(SNAPSHOT.detail);

</script>
</body>
</html>
