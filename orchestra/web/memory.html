<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestra — Memory</title>
<link rel="stylesheet" href="/static/console.css">
<style>
.page { padding: var(--s6) 0 var(--s8); }
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s4); margin-bottom: var(--s5); flex-wrap: wrap; }

.lookup {
  display: flex; gap: var(--s2);
  padding: var(--s4) var(--s5);
  flex-wrap: wrap;
  align-items: center;
}
.lookup input {
  flex: 1;
  min-width: 220px;
  min-height: 44px;
  padding: 0 var(--s4);
  background: var(--void);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.9rem;
}
.lookup input::placeholder { color: var(--ink-faint); }
@media (prefers-color-scheme: light) { .lookup input { background: var(--panel-2); } }

.mem-list { display: grid; gap: var(--s3); margin-top: var(--s5); }
.mem-card { padding: var(--s4) var(--s5); }
.mem-card .content { white-space: pre-wrap; font-size: 0.92rem; color: var(--ink); line-height: 1.6; }
.mem-card .meta {
  display: flex; gap: var(--s4); flex-wrap: wrap;
  margin-top: var(--s3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-faint);
}
.empty { border: 1px dashed var(--line); border-radius: var(--radius); }
</style>
</head>
<body>
<script src="/static/console.js"></script>
<script>document.write(consoleNav("/memory/ui"));</script>

<main class="shell page">
  <div class="page-head">
    <h1 class="display-2">Memory</h1>
    <span class="mono muted">every run leaves a lesson — pgvector, per user</span>
  </div>

  <section class="panel reveal">
    <div class="lookup">
      <input id="user-id" placeholder="user id — press Enter to inspect" aria-label="User id">
      <button class="btn btn-primary" onclick="loadMemories()">Load</button>
      <button class="btn btn-danger" onclick="deleteMemories()">Delete all</button>
    </div>
  </section>

  <div class="mem-list" id="memories-container">
    <div class="empty" id="empty-state">
      <h3>No memories loaded</h3>
      <p>Enter a user id above to inspect the lessons Orchestra has learned for them.</p>
    </div>
  </div>
</main>

<script>
"use strict";
consoleBoot("/memory/ui");

function currentUserId() {
  return document.getElementById("user-id").value.trim();
}

async function loadMemories() {
  const userId = currentUserId();
  if (!userId) { toast("Enter a user id first"); return; }
  try {
    const data = await (await fetch(`/users/${encodeURIComponent(userId)}/memories`)).json();
    renderMemories(data.memories || []);
  } catch (e) {
    toast("Failed to load memories");
  }
}

async function deleteMemories() {
  const userId = currentUserId();
  if (!userId) { toast("Enter a user id first"); return; }
  if (!confirm(`Delete ALL memories for user "${userId}"? This cannot be undone.`)) return;
  try {
    const data = await (await fetch(`/users/${encodeURIComponent(userId)}/memories`, {
      method: "DELETE",
    })).json();
    toast(`Deleted ${data.deleted} memories.`);
    loadMemories();
  } catch (e) {
    toast("Delete failed: " + e.message);
  }
}

function renderMemories(memories) {
  const container = document.getElementById("memories-container");
  const emptyState = document.getElementById("empty-state");
  if (!memories.length) {
    container.innerHTML = "";
    container.appendChild(emptyState);
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";
  container.innerHTML = memories.map((m) => `
    <article class="panel mem-card reveal in">
      <div class="content">${escapeHtml(m.content)}</div>
      <div class="meta">
        <span>#${m.id}</span>
        <span class="badge ember">${escapeHtml(m.kind)}</span>
        <span>importance ${Number(m.importance).toFixed(2)}</span>
        <span>accessed ${m.access_count}×</span>
        <span>task ${(m.source_task_id || "—").slice(0, 13)}</span>
        <span>${new Date(m.created_at).toLocaleString()}</span>
      </div>
    </article>`).join("");
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text == null ? "" : String(text);
  return div.innerHTML;
}

document.getElementById("user-id").addEventListener("keydown", (event) => {
  if (event.key === "Enter") loadMemories();
});
</script>
</body>
</html>
