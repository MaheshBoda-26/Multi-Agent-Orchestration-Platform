<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestra - Memory Dashboard</title>
    <link rel="stylesheet" href="/static/approval.css">
    <style>
        .memory-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; padding: 16px 20px; }
        .memory-meta { display: flex; gap: 16px; color: #888; font-size: 12px; margin-top: 8px; }
        .memory-content { white-space: pre-wrap; color: #333; font-size: 14px; }
        .lookup { display: flex; gap: 12px; margin-bottom: 24px; }
        .lookup input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Memory Dashboard</h1>
            <a href="/approvals/ui" class="task-link">Approvals &rarr;</a>
        </header>

        <div class="lookup">
            <input id="user-id" placeholder="Enter a user id, then press Enter">
            <button class="refresh-btn" onclick="loadMemories()">Load</button>
            <button class="btn btn-danger" onclick="deleteMemories()">Delete All</button>
        </div>

        <div id="memories-container">
            <div class="empty-state" id="empty-state">
                <h3>No memories loaded</h3>
                <p>Enter a user id above to inspect their long-term lessons.</p>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        function currentUserId() {
            return document.getElementById("user-id").value.trim();
        }

        async function loadMemories() {
            const userId = currentUserId();
            if (!userId) { alert("Enter a user id first"); return; }
            try {
                const response = await fetch(`/users/${encodeURIComponent(userId)}/memories`);
                const data = await response.json();
                renderMemories(data.memories || []);
            } catch (e) {
                console.error("Failed to load memories:", e);
            }
        }

        async function deleteMemories() {
            const userId = currentUserId();
            if (!userId) { alert("Enter a user id first"); return; }
            if (!confirm(`Delete ALL memories for user "${userId}"? This cannot be undone.`)) return;
            try {
                const response = await fetch(`/users/${encodeURIComponent(userId)}/memories`, {
                    method: "DELETE",
                });
                const data = await response.json();
                alert(`Deleted ${data.deleted} memories.`);
                loadMemories();
            } catch (e) {
                alert("Delete failed: " + e.message);
            }
        }

        function renderMemories(memories) {
            const container = document.getElementById("memories-container");
            const emptyState = document.getElementById("empty-state");
            if (memories.length === 0) {
                container.innerHTML = "";
                container.appendChild(emptyState);
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";
            container.innerHTML = memories.map((m) => `
                <div class="memory-card">
                    <div class="memory-content">${escapeHtml(m.content)}</div>
                    <div class="memory-meta">
                        <span>#${m.id}</span>
                        <span>${escapeHtml(m.kind)}</span>
                        <span>importance ${Number(m.importance).toFixed(2)}</span>
                        <span>accessed ${m.access_count}x</span>
                        <span>task ${escapeHtml(m.source_task_id || "-")}</span>
                        <span>${new Date(m.created_at).toLocaleString()}</span>
                    </div>
                </div>`).join("");
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML;
        }

        document.getElementById("user-id").addEventListener("keydown", (event) => {
            if (event.key === "Enter") loadMemories();
        });
    </script>
</body>
</html>
