<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestra — Approval Queue</title>
<style>
/* ==========================================================================
   Orchestra — "Signal Console" design system
   Dark instrument-panel register. One accent (ember), one neutral ramp,
   two fonts. All color OKLCH; all motion transform/opacity; reduced-motion
   respected everywhere.
   ========================================================================== */

@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap");

:root {
  /* Neutrals: deep blue-black ramp (hue 265) */
  --void:   oklch(0.16 0.02 265);
  --panel:  oklch(0.21 0.022 265);
  --panel-2:oklch(0.245 0.024 265);
  --line:   oklch(0.32 0.025 265);
  --line-soft: oklch(0.27 0.02 265);
  --ink:    oklch(0.93 0.008 265);
  --ink-dim:oklch(0.72 0.015 265);
  --ink-faint: oklch(0.55 0.018 265);

  /* The one accent: ember */
  --ember:      oklch(0.74 0.17 55);
  --ember-hot:  oklch(0.8 0.18 60);
  --ember-dim:  oklch(0.74 0.17 55 / 0.14);
  --ember-line: oklch(0.74 0.17 55 / 0.35);

  /* Status hues (data, not decoration) */
  --ok:      oklch(0.78 0.16 155);
  --ok-dim:  oklch(0.78 0.16 155 / 0.13);
  --warn:    oklch(0.8 0.16 85);
  --warn-dim:oklch(0.8 0.16 85 / 0.13);
  --err:     oklch(0.68 0.2 22);
  --err-dim: oklch(0.68 0.2 22 / 0.14);
  --run:     oklch(0.72 0.13 250);
  --run-dim: oklch(0.72 0.13 250 / 0.14);

  /* Type */
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* Spacing rhythm (4px base) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

  --radius: 10px;
  --radius-sm: 6px;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --fast: 160ms;
  --med: 280ms;

  /* z-scale: dropdown < sticky < toast */
  --z-sticky: 20;
  --z-toast: 30;

  /* Layout */
  --shell: 1180px;
  --nav-h: 60px;
}

/* Light mode: same structure, daylight Instruments panel. Dark stays default. */
@media (prefers-color-scheme: light) {
  :root {
    --void:   oklch(0.965 0.006 85);
    --panel:  oklch(1 0 0);
    --panel-2:oklch(0.975 0.006 85);
    --line:   oklch(0.88 0.01 85);
    --line-soft: oklch(0.92 0.008 85);
    --ink:    oklch(0.24 0.02 70);
    --ink-dim:oklch(0.42 0.02 70);
    --ink-faint:oklch(0.55 0.02 70);
    --ember:      oklch(0.62 0.17 48);
    --ember-hot:  oklch(0.66 0.18 52);
    --ember-dim:  oklch(0.62 0.17 48 / 0.10);
    --ember-line: oklch(0.62 0.17 48 / 0.30);
    --ok:      oklch(0.55 0.14 152);
    --ok-dim:  oklch(0.55 0.14 152 / 0.10);
    --warn:    oklch(0.58 0.13 80);
    --warn-dim:oklch(0.58 0.13 80 / 0.12);
    --err:     oklch(0.52 0.19 25);
    --err-dim: oklch(0.52 0.19 25 / 0.10);
    --run:     oklch(0.5 0.12 250);
    --run-dim: oklch(0.5 0.12 250 / 0.10);
  }
}

/* ------------------------------------------------------------------ reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* Subtle scanline grain over the whole console (pure CSS, no images) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0 2px,
    oklch(0 0 / 0.012) 2px 3px
  );
}
@media (prefers-color-scheme: light) {
  body::before { display: none; }
}

img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--ember); text-decoration: none; }
a:hover { color: var(--ember-hot); }
pre, code, kbd { font-family: var(--font-mono); }
::selection { background: var(--ember-line); color: var(--ink); }

:focus-visible {
  outline: 2px solid var(--ember);
  outline-offset: 2px;
  border-radius: 2px;
}

/* ------------------------------------------------------------------ shell */
.shell {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0 var(--s5);
  position: relative;
  z-index: 1;
}

/* ------------------------------------------------------------------ type */
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.12; text-wrap: balance; }

.display-1 {
  font-size: clamp(2.6rem, 6.5vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.03em;
}
.display-2 {
  font-size: clamp(1.8rem, 3.6vw, 2.6rem);
  font-weight: 700;
  letter-spacing: -0.02em;
}
.lede {
  color: var(--ink-dim);
  font-size: clamp(1.05rem, 1.8vw, 1.25rem);
  max-width: 58ch;
}

.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
.small { font-size: 0.85rem; }

/* Section label: mono tag with rule — the console's one recurring device */
.tagline {
  display: flex;
  align-items: center;
  gap: var(--s3);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ember);
  margin-bottom: var(--s5);
}
.tagline::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, var(--ember-line), transparent);
}

/* ------------------------------------------------------------------ nav */
.console-nav {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  height: var(--nav-h);
  display: flex;
  align-items: center;
  background: oklch(from var(--void) l c h / 0.82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.console-nav .shell {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--s5);
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--s2);
  color: var(--ink);
  font-weight: 700;
  letter-spacing: -0.01em;
  font-size: 1.05rem;
}
.brand:hover { color: var(--ink); }
.brand .spark {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--ember);
  box-shadow: 0 0 12px var(--ember-line), 0 0 2px var(--ember);
}
.nav-links {
  display: flex;
  gap: var(--s1);
  margin-left: auto;
  align-items: center;
}
.nav-links a {
  color: var(--ink-dim);
  font-size: 0.92rem;
  font-weight: 500;
  padding: var(--s2) var(--s3);
  border-radius: var(--radius-sm);
  transition: color var(--fast) var(--ease-out), background var(--fast) var(--ease-out);
}
.nav-links a:hover { color: var(--ink); background: var(--panel-2); }
.nav-links a[aria-current="page"] { color: var(--ember); }
.nav-cta {
  margin-left: var(--s2);
  border: 1px solid var(--ember-line);
  color: var(--ember) !important;
}
.nav-cta:hover { background: var(--ember-dim) !important; }
@media (max-width: 760px) {
  .nav-links a:not(.nav-cta) { display: none; }
}

/* ------------------------------------------------------------------ buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s5);
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.95rem;
  border: 1px solid transparent;
  transition:
    background var(--fast) var(--ease-out),
    border-color var(--fast) var(--ease-out),
    color var(--fast) var(--ease-out),
    box-shadow var(--fast) var(--ease-out);
  cursor: pointer;
}
.btn:disabled { opacity: 0.55; cursor: wait; }
.btn-primary {
  background: var(--ember);
  color: oklch(0.18 0.03 55);
  box-shadow: 0 0 0 0 var(--ember-line);
}
.btn-primary:hover:not(:disabled) {
  background: var(--ember-hot);
  box-shadow: 0 4px 20px var(--ember-line);
}
.btn-outline {
  border-color: var(--line);
  color: var(--ink);
  background: transparent;
}
.btn-outline:hover:not(:disabled) { border-color: var(--ember-line); color: var(--ember); background: var(--ember-dim); }
.btn-ghost { color: var(--ink-dim); }
.btn-ghost:hover:not(:disabled) { color: var(--ink); background: var(--panel-2); }
.btn-success { background: var(--ok-dim); color: var(--ok); border-color: oklch(from var(--ok) l c h / 0.35); }
.btn-success:hover:not(:disabled) { background: var(--ok); color: oklch(0.18 0.03 155); }
.btn-danger { background: var(--err-dim); color: var(--err); border-color: oklch(from var(--err) l c h / 0.35); }
.btn-danger:hover:not(:disabled) { background: var(--err); color: oklch(0.18 0.03 22); }

/* ------------------------------------------------------------------ panels */
.panel {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
}
.panel-pad { padding: var(--s5); }

.panel-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  font-weight: 600;
  font-size: 1rem;
}
.panel-title .mono { font-size: 0.78rem; color: var(--ink-faint); }

/* ------------------------------------------------------------------ badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}
.badge::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.badge.ok   { color: var(--ok);   background: var(--ok-dim);   border-color: oklch(from var(--ok) l c h / 0.4); }
.badge.warn { color: var(--warn); background: var(--warn-dim); border-color: oklch(from var(--warn) l c h / 0.4); }
.badge.err  { color: var(--err);  background: var(--err-dim);  border-color: oklch(from var(--err) l c h / 0.4); }
.badge.run  { color: var(--run);  background: var(--run-dim);  border-color: oklch(from var(--run) l c h / 0.4); }
.badge.run::before { animation: pulse 1.6s ease-in-out infinite; }
.badge.ember { color: var(--ember); background: var(--ember-dim); border-color: var(--ember-line); }

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.8); }
}

/* Status dot (task lists) */
.dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot.completed { background: var(--ok); }
.dot.running, .dot.queued { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
.dot.awaiting_human { background: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
.dot.failed, .dot.cancelled { background: var(--err); }

/* ------------------------------------------------------------------ data */
.kv {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: var(--s2) var(--s4);
  font-size: 0.92rem;
}
.kv dt { color: var(--ink-faint); }
.kv dd { color: var(--ink); overflow-wrap: anywhere; }

.code-box {
  background: var(--void);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: var(--s4);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--ink-dim);
  overflow: auto;
  max-height: 340px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.light .code-box { background: var(--panel-2); }

/* ------------------------------------------------------------------ empty state */
.empty {
  text-align: center;
  padding: var(--s8) var(--s5);
  color: var(--ink-faint);
}
.empty h3 { color: var(--ink-dim); margin-bottom: var(--s2); font-size: 1.1rem; }

/* ------------------------------------------------------------------ reveal choreography */
.reveal {
  opacity: 0;
  transform: translateY(16px);
}
.reveal.in {
  opacity: 1;
  transform: none;
  transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
  transition-delay: var(--stagger, 0ms);
}

/* ------------------------------------------------------------------ reduced motion: kill everything */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .reveal { opacity: 1; transform: none; }
}

</style>
<style>
.page { padding: var(--s6) 0 var(--s8); }
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s4); margin-bottom: var(--s5); flex-wrap: wrap; }

.approval-card { margin-bottom: var(--s4); transition: border-color var(--med) var(--ease-out); }
.approval-card:hover { border-color: var(--line); }
.approval-card .card-header {
  display: flex; justify-content: space-between; align-items: center; gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  flex-wrap: wrap;
}
.card-body { padding: var(--s5); }

.detail-row {
  display: grid; grid-template-columns: 150px 1fr; gap: var(--s4);
  padding: var(--s2) 0;
  font-size: 0.92rem;
}
.detail-label { color: var(--ink-faint); }
.detail-value { overflow-wrap: anywhere; }
.detail-value code {
  background: var(--void);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.8rem;
}

.context-box {
  background: var(--void);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: var(--s4);
  margin-top: var(--s4);
  max-height: 300px;
  overflow: auto;
}
.context-box strong { display: block; margin-bottom: var(--s2); font-size: 0.85rem; color: var(--ink-faint); }
.context-box pre { white-space: pre-wrap; font-size: 0.78rem; color: var(--ink-dim); overflow-wrap: anywhere; }
@media (prefers-color-scheme: light) { .context-box { background: var(--panel-2); } }

.actions {
  display: flex; gap: var(--s2); margin-top: var(--s5); padding-top: var(--s4);
  border-top: 1px solid var(--line-soft); flex-wrap: wrap;
}

.mod-plan, .clarify-log {
  margin-top: var(--s4);
  padding: var(--s4);
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
}
.mod-plan textarea, .clarify-form textarea {
  width: 100%; min-height: 150px;
  padding: var(--s3);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  resize: vertical;
}
.mod-plan .hint { color: var(--ink-faint); font-size: 0.8rem; margin-top: var(--s2); }
.form-actions { display: flex; gap: var(--s2); margin-top: var(--s3); }
.clarify-log .entries .entry { margin-bottom: var(--s3); }
.clarify-log .q { font-weight: 600; }
.clarify-log .a { color: var(--ink-dim); margin-left: var(--s4); white-space: pre-wrap; }
.clarify-form { display: flex; gap: var(--s2); margin-top: var(--s2); align-items: stretch; }
.clarify-form textarea { min-height: 60px; flex: 1; font-family: inherit; font-size: 0.9rem; }

.status-note { margin-top: var(--s3); font-size: 0.88rem; color: var(--ok); }
.error-note { margin-top: var(--s3); font-size: 0.88rem; color: var(--err); }

.empty h3 { margin-bottom: var(--s2); }
.empty .ok-ring {
  width: 56px; height: 56px;
  margin: 0 auto var(--s4);
  border-radius: 50%;
  border: 1px solid oklch(from var(--ok) l c h / 0.4);
  background: var(--ok-dim);
  display: grid; place-items: center;
  color: var(--ok);
}
</style>

<script>
/* Orchestra console runtime: nav injection, scroll reveals, count-ups,
 * relative time, toasts. Shared by every page. No dependencies. */
"use strict";

/* ------------------------------------------------------------------ nav */
function consoleNav(active) {
  const links = [
    ["/explorer", "Explorer"],
    ["/dashboard", "Dashboard"],
    ["/approvals/ui", "Approvals"],
    ["/memory/ui", "Memory"],
  ];
  return `
    <nav class="console-nav">
      <div class="shell">
        <a class="brand" href="/">
          <span class="spark" aria-hidden="true"></span> Orchestra
        </a>
        <div class="nav-links">
          ${links.map(([href, label]) =>
            `<a href="${href}"${href === active ? ' aria-current="page"' : ""}>${label}</a>`
          ).join("")}
          <a href="/#new-task" class="nav-cta">New task</a>
        </div>
      </div>
    </nav>`;
}

function mountNav(active) {
  document.body.insertAdjacentHTML("afterbegin", consoleNav(active));
}

/* ------------------------------------------------------------------ reveals */
const revealObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (entry.isIntersecting) {
      entry.target.classList.add("in");
      revealObserver.unobserve(entry.target);
    }
  }
}, { threshold: 0.12 });

function observeReveals(root = document) {
  root.querySelectorAll(".reveal:not(.in)").forEach((el) => revealObserver.observe(el));
}

/* ------------------------------------------------------------------ count-ups */
function countUp(el, target, { decimals = 0, suffix = "", duration = 900 } = {}) {
  const start = performance.now();
  const from = 0;
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 4);
    el.textContent = (from + (target - from) * eased).toFixed(decimals) + suffix;
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function observeCountUps(root = document) {
  const els = root.querySelectorAll("[data-count]");
  const io = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const el = entry.target;
      io.unobserve(el);
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        el.textContent = Number(el.dataset.count).toLocaleString();
        continue;
      }
      countUp(el, Number(el.dataset.count), {
        decimals: Number(el.dataset.decimals || 0),
        suffix: el.dataset.suffix || "",
        duration: Number(el.dataset.duration || 900),
      });
    }
  }, { threshold: 0.4 });
  els.forEach((el) => io.observe(el));
}

/* ------------------------------------------------------------------ time */
function timeAgo(iso) {
  if (!iso) return "—";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

/* ------------------------------------------------------------------ toast */
function toast(message) {
  let host = document.querySelector(".toast-host");
  if (!host) {
    host = document.createElement("div");
    host.className = "toast-host";
    host.style.cssText =
      "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);" +
      "display:flex;flex-direction:column;gap:8px;z-index:30;align-items:center;";
    document.body.appendChild(host);
  }
  const el = document.createElement("div");
  el.className = "toast";
  el.style.cssText =
    "background:var(--panel-2);border:1px solid var(--ember-line);color:var(--ink);" +
    "font-size:0.9rem;padding:10px 18px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.35);" +
    "opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;";
  el.textContent = message;
  host.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = "1"; el.style.transform = "none"; });
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

/* ------------------------------------------------------------------ svg icon helper (no emoji icons) */
function icon(name, size = 16) {
  const paths = {
    play:   '<path d="M8 5v14l11-7z"/>',
    pulse:  '<path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    layers: '<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m3 17 9 5 9-5" fill="none" stroke="currentColor" stroke-width="2"/>',
    shield: '<path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z"/>',
    cpu:    '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/>',
    brain:  '<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
    arrow:  '<path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    check:  '<path d="m5 13 4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>',
    x:      '<path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>',
    clock:  '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    coins:  '<circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 9.5a5.5 5.5 0 1 1-6 9" fill="none" stroke="currentColor" stroke-width="2"/>',
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${paths[name] || ""}</svg>`;
}

/* ------------------------------------------------------------------ boot helpers */
function consoleBoot(active) {
  // Idempotent: pages that already document.write'd the nav keep it; bare
  // fragments (previews, tests) get it mounted here exactly once.
  if (!document.querySelector(".console-nav")) mountNav(active);
  observeReveals();
  observeCountUps();
}

</script>
