; mypy configuration.
; TRD section 2 asks for strict typing on graph/, tools/ and llm/; the rest of
; the tree is checked with the default settings until it catches up.
[mypy]
python_version = 3.14
files = api, graph, agents, tools, llm, memory, observability, migrations, worker
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True

[mypy-graph.*,tools.*,llm.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
